出、脱敏和传递；服务从开发服务器已能取得材料开始。\n- 扩展到首轮规模以外的商业化、多组织经营及大规模并发。\n- 将企微作为必需核心入口；通知渠道是否可选可在交互设计中处理。"}}, "issues": [{"number": 2, "title": "材料、需求与验收基准如何构成一次完整接入任务？", "state": "open", "body": "## Question\n\n如何为常规接入和新增数据源定义首版任务契约，使提交者提供的材料可被整理、需求可被确认、最终结果可被复现验收？\n\n需要明确：任务与模型、子分、数据源的关系；材料必需项及指定读取位置；需求确认与版本；manifest 的业务字段；缺项、冲突、基准有误或用户更换材料时的处理；原始变量到最终子分的比较链；四项完全一致和空值、重复主键、击中列的判定；代表性案例与已有验收脚本如何取得、版本如何固定。\n\n沿用已确认的服务起点与四项一致性规则，不替用户补造业务语义。答案应包含输入输出示例和验收用例，明确仍需取得的实际材料。\n", "state_reason": null, "created_at": "2026-10-26T02:55:26Z", "updated_at": "2026-10-26T02:55:26Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/2", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#2", "assignees": [], "status": "frontier", "dependenciesKnown": true, "blockedBy": [], "comments": []}, {"number": 3, "title": "提交者、维护者与 Agent 的权限和审批边界如何定义？", "state": "open", "body": "## Question\n\n首版如何明确谁能提交、确认需求、读取材料、修改代码、批准公共框架变更、合并和接管任务？\n\n需要明确：身份来源与角色绑定；公共框架及任务私有范围的识别依据（目录之外的接口、配置、注册表和依赖）；审批绑定的方案与版本、变更后失效；历史同类审批是否存在正式长期授权及其撤销规则；受保护策略与工具入口；并发任务的读写边界。\n\n沿用“每次新的公共框架改动前由维护者审批、公共框架由维护者合并”的基线。若要改变该规则，必须在本议题由用户明确作出决定。答案为权限矩阵、审批生命周期和越权反例。\n", "state_reason": null, "created_at": "2026-10-26T02:55:32Z", "updated_at": "2026-10-26T02:55:32Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/3", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#3", "assignees": [], "status": "frontier", "dependenciesKnown": true, "blockedBy": [], "comments": []}, {"number": 4, "title": "六类 Agent 如何交接，任务在失败和人工介入后如何继续？", "state": "open", "body": "## Question\n\n产品经理、开发、Review、验收、发版、知识库维护六类 Agent 与流程控制器之间，哪些状态转换和交接字段是首版必须固定的？\n\n需要明确：需求补充、方案重选、代码返工、验收失败、等待审批、取消、超时、人工接管与恢复；每处循环的轮次、时间、费用限制；需求或代码版本变化后哪些结果失效；任务结束与知识库失败是否分离；两项并发任务的调度及重试幂等边界。\n\n答案包含状态表、Agent 交接契约及异常路径。职责分工不自动等同于六个独立进程；物理实现留给架构决策。\n\n前置决定：\n- [材料、需求与验收基准如何构成一次完整接入任务？](https://github.com/sidpku/DSAaaS/issues/2)\n- [提交者、维护者与 Agent 的权限和审批边界如何定义？](https://github.com/sidpku/DSAaaS/issues/3)\n", "state_reason": null, "created_at": "2026-10-26T02:55:39Z", "updated_at": "2026-10-26T03:07:47Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/4", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#4", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#2", "sidpku/DSAaaS#3"], "comments": []}, {"number": 5, "title": "候选执行框架有哪些可核实能力与必须补建的缺口？", "state": "closed", "body": "## Question\n\n对 Python 自建执行服务、DeepSeek Harness 复用、以及一个有充分一手资料的持久化工作流候选（优先调查 LangGraph），它们对本地图要求有哪些已提供能力、需自建能力和无法确认的能力？\n\n逐项核对后台运行、断线与重启恢复、人工等待与恢复、多用户身份和权限扩展、工具拦截、双任务并发及隔离、审计、模型提供商适配、许可证与维护成本的证据。用官方文档及固定版本源码；若找不到官方项目或资料，明确记为未核实，不借第三方同名产品补全。\n\n产出事实对照表、源码或文档链接、版本与日期、候选最小验证场景。只回答能力事实与缺口，不代替用户选型，不把文档声称当作已经实测。报告保存在 research 分支并从本议题链接。\n", "state_reason": "completed", "created_at": "2026-10-26T02:55:45Z", "updated_at": "2026-10-26T03:34:25Z", "closed_at": "2026-10-26T03:34:25Z", "url": "https://github.com/sidpku/DSAaaS/issues/5", "labels": ["wayfinder:research"], "type": "research", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#5", "assignees": ["sidpku"], "status": "closed", "dependenciesKnown": true, "blockedBy": [], "comments": [{"body": "## Resolution — 一手资料能力调查完成\n\n[固定版本研究报告](https://github.com/sidpku/DSAaaS/blob/01bd8dba265bcf15cc646c19d157b61a74dd2c07/docs/research/platform-capabilities.md)\n\n- Python 自建需补齐任务持久化、审批、身份和隔离；不能把标准库并发能力当成业务恢复能力。\n- Harness 有工具策略、审批、持久日志和非 owner 授权扩展点，但默认连接使用 owner；这不等于开箱即用的提交者／维护者分权。\n- LangGraph 核心持久化与中断机制、Agent Server 部署能力及许可须分别评估；恢复与外部副作用的幂等性仍需验证。\n- 报告提供固定源码版本、能力对照及 8 项最小验证场景。按既有可见性要求允许授权范围内跨任务查看；写入、审批、恢复和取消另按权限矩阵控制。\n\n证据状态：仅完成公开文档与源码静态调查，未安装运行候选、未验证性能或安全。本票的事实调查已完成；最终选型与运行验证仍由后续决策票处理。\n\n后续：[选择进入验证的候选技术路线](https://github.com/sidpku/DSAaaS/issues/7)、[验证权限、后台恢复和并发隔离](https://github.com/sidpku/DSAaaS/issues/8)。\n", "url": "https://github.com/sidpku/DSAaaS/issues/5#issuecomment-6407518267", "author": "sidpku", "createdAt": "2026-10-26T03:24:31Z"}]}, {"number": 6, "title": "模型评分与风险概率判断有哪些可靠证据和使用边界？", "state": "closed", "body": "## Question\n\n对于方案比较、公共框架影响、破坏性操作和提示词注入识别，现有一手研究或官方实现能支持模型做哪些判断，不能支持哪些保证？\n\n重点调查结构化输出与失败处理、评分／自报概率和实际发生频率的差异、输入截断及完整 diff 覆盖、评估集与校准、漏判／误拦、独立审查和固定权限规则的分工。区分可核查事实、研究结论与在本项目上的推断。\n\n产出少量可执行的评估方法及必要样本类型；不预设模型供应商、不编造阈值或成功率，不调用付费模型。报告存入 research 分支并从本议题链接。后续架构议题据此决定首版实现及必要验证。\n", "state_reason": "completed", "created_at": "2026-10-26T02:55:52Z", "updated_at": "2026-10-26T07:05:51Z", "closed_at": "2026-10-26T07:05:51Z", "url": "https://github.com/sidpku/DSAaaS/issues/6", "labels": ["wayfinder:research"], "type": "research", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#6", "assignees": ["sidpku"], "status": "closed", "dependenciesKnown": true, "blockedBy": [], "comments": [{"body": "## Resolution — 模型判断证据与边界调查完成\n\n[固定版本研究报告](https://github.com/sidpku/DSAaaS/blob/9fd583f2f1686107bf8a01bed0acf1e2e4fda475/docs/research/model-judgment-boundaries.md)\n\n- 方案评分、自报概率、可重复验证结果和有效授权具有不同含义；特定研究中的校准结果不能直接外推为本项目事故概率。\n- 结构化输出合规不能保证语义正确；拒绝、截断和失败必须作为明确状态处理。\n- 输入覆盖需要版本、清单和片段记录；送达完整不等于模型理解完整。\n- 多个审查 Agent 的共同结论不能证明错误独立。固定权限必须在副作用前执行，模型分数不能覆盖审批。\n- 报告提供判断与校准、方案比较、覆盖与故障、注入与绕权四组评估方案。没有调用模型、测量成功率、选择供应商或确定数值阈值。\n\n研究问题已完成，运行结论仍未决。调研明确了后续问题，新增：[模型判断用于哪些分支，评估标准和人工复核门槛如何确定？](https://github.com/sidpku/DSAaaS/issues/14)、[模型判断、输入覆盖与固定规则组合能否达到首版验证门槛？](https://github.com/sidpku/DSAaaS/issues/15)。最终架构决定等待验证结果。\n", "url": "https://github.com/sidpku/DSAaaS/issues/6#issuecomment-6410265053", "author": "sidpku", "createdAt": "2026-10-26T07:05:46Z"}]}, {"number": 7, "title": "哪条候选技术路线进入首轮关键能力验证？", "state": "open", "body": "## Question\n\n依据候选框架事实、任务状态与权限要求，在 Python 自建、Harness 复用及调研候选中，先验证哪一条路线？\n\n需要明确首版候选组合：入口、流程与状态存储、Agent 执行方式、身份与工具授权、任务工作区、目标部署环境；列出可复用部分和必须补建部分，以既有时间与费用约束说明取舍。\n\n本决定仅选择待验证路线及淘汰条件，不能据此宣布最终选型。目标开发环境、网络、模型和测试材料如尚不可用，应生成精确的准备任务。\n\n前置决定：\n- [候选执行框架有哪些可核实能力与必须补建的缺口？](https://github.com/sidpku/DSAaaS/issues/5)\n- [六类 Agent 如何交接，任务在失败和人工介入后如何继续？](https://github.com/sidpku/DSAaaS/issues/4)\n", "state_reason": null, "created_at": "2026-10-26T02:55:56Z", "updated_at": "2026-10-26T03:07:54Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/7", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#7", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#5", "sidpku/DSAaaS#4"], "comments": []}, {"number": 8, "title": "候选路线能否通过权限、后台恢复和并发隔离验证？", "state": "open", "body": "## Question\n\n以可丢弃的小型原型验证候选路线：提交者无法伪造维护者审批或绕过写入限制；关闭页面后任务继续；服务重启后恢复任务、审批等待和循环计数；两项任务并发时写入隔离；重试不重复执行关键动作。\n\n用户观察原型行为并确认是否符合预期。必须提供复现步骤、运行环境、证据、失败案例及剩余缺口。模拟 UI 不能替代真实执行和权限验证；本地结果不能声称已证明目标服务器可用。实际环境无法取得时保持未决并创建准备任务。\n\n原型只为选型提供证据，保存在可丢弃分支；不开发完整产品。\n\n前置决定：\n- [哪条候选技术路线进入首轮关键能力验证？](https://github.com/sidpku/DSAaaS/issues/7)\n", "state_reason": null, "created_at": "2026-10-26T02:56:01Z", "updated_at": "2026-10-26T03:08:00Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/8", "labels": ["wayfinder:prototype"], "type": "prototype", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#8", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#7"], "comments": []}, {"number": 9, "title": "提交、补充材料、审批与查看结果的交互是否足够易用？", "state": "open", "body": "## Question\n\n用可操作的粗略页面原型，确认提交者和维护者能否完成材料提交、需求确认、补充材料、查看进度和差异、审批、接管与查看交付报告。\n\n至少演示常规接入和新增数据源任务，以及等待用户、验收失败、等待维护者、超限接管等路径。界面须展示明确状态与下一步责任人；由用户反馈判定是否符合提交者约 10 分钟、维护者不超过 20 分钟的目标方向，原型演示不能当作真实工时达标证据。\n\n答案应为页面／操作清单、关键文案及用户确认的行为；原型链接保存在本议题。\n\n前置决定：\n- [六类 Agent 如何交接，任务在失败和人工介入后如何继续？](https://github.com/sidpku/DSAaaS/issues/4)\n", "state_reason": null, "created_at": "2026-10-26T02:56:06Z", "updated_at": "2026-10-26T03:08:05Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/9", "labels": ["wayfinder:prototype"], "type": "prototype", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#9", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#4"], "comments": []}, {"number": 10, "title": "验收后如何受控合并、发版并留下可追溯交付记录？", "state": "open", "body": "## Question\n\n首版对任务范围变更和公共框架变更分别如何合并、发版、交付和通知？\n\n明确目标分支、版本标识、发版 Agent 可执行动作、维护者必须执行的动作、冲突处理、合并前重新验收、审批与代码版本绑定、推送失败及重复执行、交付报告与通知时点。公共框架仍由维护者合并，除非用户显式改变基线规则。\n\n答案包含放行条件、权限矩阵的补充和异常处理用例；这里决定规则，不执行真实业务发版。\n\n前置决定：\n- [材料、需求与验收基准如何构成一次完整接入任务？](https://github.com/sidpku/DSAaaS/issues/2)\n- [提交者、维护者与 Agent 的权限和审批边界如何定义？](https://github.com/sidpku/DSAaaS/issues/3)\n- [六类 Agent 如何交接，任务在失败和人工介入后如何继续？](https://github.com/sidpku/DSAaaS/issues/4)\n", "state_reason": null, "created_at": "2026-10-26T02:56:12Z", "updated_at": "2026-10-26T03:08:15Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/10", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#10", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#2", "sidpku/DSAaaS#3", "sidpku/DSAaaS#4"], "comments": []}, {"number": 11, "title": "知识库记录什么，如何区分经验、事实和正式授权？", "state": "open", "body": "## Question\n\n首版如何沉淀成功、失败和人工接管任务的经验，并使后续 Agent 可查证地复用？\n\n明确最小知识条目、证据来源、需求与代码版本、维护者审核、过期或纠错、检索与引用、更新失败处理；正式授权规则的维护路径必须与经验记录区分。历史审批只能作为参考，不能自动扩大权限。\n\n答案为最小信息契约和治理规则，避免把知识库扩展成与首版无关的平台。\n\n前置决定：\n- [六类 Agent 如何交接，任务在失败和人工介入后如何继续？](https://github.com/sidpku/DSAaaS/issues/4)\n", "state_reason": null, "created_at": "2026-10-26T02:56:18Z", "updated_at": "2026-10-26T03:08:22Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/11", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#11", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#4"], "comments": []}, {"number": 12, "title": "结合验证证据，首版最终采用什么架构和模型判断机制？", "state": "open", "body": "## Question\n\n根据关键能力原型的实际证据，最终采用哪条技术路线，各组件如何连接，并如何在首版中使用模型评分与风险判断？\n\n需确定模块边界、接口、状态与数据存储、Agent 执行和工具授权、部署拓扑、审计、模型适配与失败策略；明确哪些动作只由固定规则控制，哪些判断需要独立 Review／人工介入。模型与阈值若需要实测才能定案，应先生成并解决验证议题，不能以待定值关闭本议题。\n\n明确候选淘汰理由和可接受限制，按现有预算估算开发与维护投入；不可将候选路线或文档事实当作最终验证结果。\n\n前置决定：\n- [候选路线能否通过权限、后台恢复和并发隔离验证？](https://github.com/sidpku/DSAaaS/issues/8)\n- [模型评分与风险概率判断有哪些可靠证据和使用边界？](https://github.com/sidpku/DSAaaS/issues/6)\n- [验收后如何受控合并、发版并留下可追溯交付记录？](https://github.com/sidpku/DSAaaS/issues/10)\n- [知识库记录什么，如何区分经验、事实和正式授权？](https://github.com/sidpku/DSAaaS/issues/11)\n- [模型判断、输入覆盖与固定规则组合能否达到首版验证门槛？](https://github.com/sidpku/DSAaaS/issues/15)\n", "state_reason": null, "created_at": "2026-10-26T02:56:24Z", "updated_at": "2026-10-26T03:26:04Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/12", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#12", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#8", "sidpku/DSAaaS#6", "sidpku/DSAaaS#10", "sidpku/DSAaaS#11", "sidpku/DSAaaS#15"], "comments": []}, {"number": 13, "title": "首版系统规格是否完整到可以直接进入开发？", "state": "open", "body": "## Question\n\n将已解决议题的决定汇编为首版系统规格，并与用户进行交叉检查：服务边界、角色、输入输出、页面操作、状态机与异常路径、交接契约、权限矩阵、系统接口、架构、发版与知识库，以及可执行验收用例是否完整、一致、可追溯？\n\n逐项覆盖常规接入和新增数据源，四项完全一致、后台恢复、并发隔离和权限控制，以及人工工时、模型费用的后续测量方法。关键技术结论应有验证证据；未决事项先成为新的子议题，不能用模糊的“开发时再定”结束地图。\n\n用户确认规格可进入开发后，本议题才可解决。规格作为最终交付资产链接到本议题；地图只保留摘要与链接。\n\n前置决定：\n- [结合验证证据，首版最终采用什么架构和模型判断机制？](https://github.com/sidpku/DSAaaS/issues/12)\n- [提交、补充材料、审批与查看结果的交互是否足够易用？](https://github.com/sidpku/DSAaaS/issues/9)\n", "state_reason": null, "created_at": "2026-10-26T02:56:28Z", "updated_at": "2026-10-26T03:08:38Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/13", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#13", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#12", "sidpku/DSAaaS#9"], "comments": []}, {"number": 14, "title": "模型判断用于哪些分支，评估标准和人工复核门槛如何确定？", "state": "open", "body": "## Question\n\n在不削弱固定权限与验收规则的前提下，首版哪些步骤使用方案评分、风险信号或事件概率，哪些步骤直接由程序或人工决定？\n\n依据模型判断调研，定义每个目标事件、候选模型与输出契约、样本与争议标签的责任人、校准和测试集划分、漏判／误拦／人工复核负担的可接受标准、覆盖不足与判断失败时的动作，以及需要测试的数值阈值候选。\n\n既有“模型给分和概率、程序按固定规则分流”的方向沿用；具体使用范围、模型和阈值仍待本票澄清。若用户决定收缩首版范围，显式记录对基线的调整。不能用自报概率替代实际可靠性证据。\n\n答案为可移交验证的判断契约与评估方案，不得把尚未测试的门槛标为已有效。\n\n前置决定：\n- [模型评分与风险概率判断有哪些可靠证据和使用边界？](https://github.com/sidpku/DSAaaS/issues/6)\n- [材料、需求与验收基准如何构成一次完整接入任务？](https://github.com/sidpku/DSAaaS/issues/2)\n- [提交者、维护者与 Agent 的权限和审批边界如何定义？](https://github.com/sidpku/DSAaaS/issues/3)\n", "state_reason": null, "created_at": "2026-10-26T03:22:24Z", "updated_at": "2026-10-26T03:26:13Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/14", "labels": ["wayfinder:grilling"], "type": "grilling", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#14", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#6", "sidpku/DSAaaS#2", "sidpku/DSAaaS#3"], "comments": []}, {"number": 15, "title": "模型判断、输入覆盖与固定规则组合能否达到首版验证门槛？", "state": "open", "body": "## Question\n\n用已确认的模型判断契约和候选技术路线构建可丢弃原型，检验模型判断与执行层组合是否达到首版要求。\n\n覆盖方案顺序偏差、已知违规与正常任务、共同漏判、长输入及完整 diff 覆盖、结构化输出拒绝／截断／失败、提示注入、审批后范围改变和直接伪造“模型已批准”的动作。程序控制可用合成样本；模型质量与概率校准必须有真实模型输出和独立带标签样本，不能用模拟值证明。\n\n记录模型及提示版本、样本分子分母、漏判与误拦、人工复核比例、调用费用和未覆盖范围。固定权限仍不可由模型分数豁免。由用户观察和确认结果是否可接受；调用条件或样本缺失时保持未决并创建准备任务。\n\n本票提供选型证据；首版最终采用的模型、阈值及回退策略由架构票结合结果确认。\n\n前置决定：\n- [模型判断用于哪些分支，评估标准和人工复核门槛如何确定？](https://github.com/sidpku/DSAaaS/issues/14)\n- [哪条候选技术路线进入首轮关键能力验证？](https://github.com/sidpku/DSAaaS/issues/7)\n", "state_reason": null, "created_at": "2026-10-26T03:22:31Z", "updated_at": "2026-10-26T03:26:22Z", "closed_at": null, "url": "https://github.com/sidpku/DSAaaS/issues/15", "labels": ["wayfinder:prototype"], "type": "prototype", "repo": "sidpku/DSAaaS", "key": "sidpku/DSAaaS#15", "assignees": [], "status": "blocked", "dependenciesKnown": true, "blockedBy": ["sidpku/DSAaaS#14", "sidpku/DSAaaS#7"], "comments": []}], "external": [], "edges": [{"source": "sidpku/DSAaaS#2", "target": "sidpku/DSAaaS#4"}, {"source": "sidpku/DSAaaS#3", "target": "s   const badge = issue => `<span class="status-badge ${escape(issue.status)}"><span class="dot ${escape(issue.status)}"></span>${STATUS[issue.status] || '待核实'}</span>`;
  function notice(message, error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error);$('notice').hidden=!message;}
  let toastTimer;
  function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3300);}
  function related() {
    const ids=new Set();if(!state.selected||!state.data)return ids;
    ids.add(state.selected);
    for (const direction of ['up','down']) {
      const queue=[state.selected],seen=new Set(queue);
      while(queue.length){const n=queue.shift();for(const e of state.data.edges){const next=direction==='up'?(e.target===n?e.source:null):(e.source===n?e.target:null);if(next!==null&&!seen.has(next)){seen.add(next);ids.add(next);queue.push(next);}}}

    return ids;
  }
  function filtered() {
    const rel=state.focus?related():null;
    return (state.data?.issues||[]).filter(i => (state.scope!=='frontier'||i.status==='frontier') && (state.status==='all'||i.status===state.status) && (state.type==='all'||i.type===state.type) && (!state.search||`${i.title} ${i.body||''}`.toLowerCase().includes(state.search.toLowerCase())) && (!rel||rel.has(i.key)));
  }
  function renderList(){
    const items=filtered();
    $('issueList').innerHTML=items.map(i=>`<button class="issue-row ${i.key===state.selected?'selected':''}" data-issue="${i.key}" aria-label="${escape(i.title)}"><span class="dot ${i.status}"></span><span><span class="row-title">${escape(i.title)}</span><span class="row-meta">${TYPE[i.type]} · ${STATUS[i.status]}${i.assignees.length?' · '+escape(i.assignees.join(', ')):''}</span></span></button>`).join('') || '<div class="empty-note">没有符合条件的决策。<br>可以调整搜索或筛选条件。</div>';

  }
  function layout(nodes, edges) {
    const ids=new Set(nodes.map(n=>n.key)),incoming=new Map(nodes.map(n=>[n.key,[]]));
    edges.filter(e=>ids.has(e.source)&&ids.has(e.target)).forEach(e=>incoming.get(e.target).push(e.source));
    const rank=new Map(),active=new Set();let cyclic=false;
    function visit(id){if(rank.has(id))return rank.get(id);if(active.has(id)){cyclic=true;return 0;}active.add(id);const level=Math.max(0,...incoming.get(id).map(p=>visit(p)+1));active.delete(id);rank.set(id,Math.min(level,nodes.length));return rank.get(id);}
    nodes.forEach(n=>visit(n.key));
    const levels=new Map();nodes.forEach(n=>{const r=rank.get(n.key);if(!levels.has(r))levels.set(r,[]);levels.get(r).push(n);});
    const rows=Math.max(1,...[...levels.values()].map(a=>a.length));const positions=new Map();
    for(const [r,items] of [...levels].sort((a,b)=>a[0]-b[0])) {
      const barycenter = n => {const ys=incoming.get(n.key).map(id=>positions.get(id)?.y).filter(y=>y!==undefined);return ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:0;};
      items.sort((a,b)=>barycenter(a)-barycenter(b));
      items.forEach((n,index)=>positions.set(n.key,{x:r*332+24,y:index*164+(rows-items.length)*82+24}));

  }
  function renderGraph(fit=false) {
    if(!state.data)return;

    const edges=state.data.edges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));
    const grid=layout(nodes,edges),rel=related();state.width=grid.width;state.height=grid.height;
    $('graphWorld').style.width=grid.width+'px';$('graphWorld').style.height=grid.height+'px';
    $('graphNodes').innerHTML=nodes.map(n=>{const p=grid.positions.get(n.key);return `<button class="graph-node ${n.status} ${n.key===state.selected?'selected':''} ${rel.size&&!rel.has(n.key)?'dim':''}" data-issue="${n.key}" style="left:${p.x}px;top:${p.y}px" title="${escape(n.title)}" aria-label="${escape(n.title)}，${STATUS[n.status]}"><span class="node-top"><span class="dot ${n.status}"></span><span class="node-title">${escape(n.title)}</span></span><span class="node-bottom"><span class="node-type">${n.external?'地图外前置':TYPE[n.type]}</span><span class="node-status ${n.status}">${STATUS[n.status]}${n.assignees.length?' · '+escape(n.assignees[0]):''}</span></span></button>`;}).join('');
    $('graphEdges').setAttribute('width',grid.width);$('graphEdges').setAttribute('height',grid.height);
    $('graphEdges').innerHTML='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a9b8c2" stroke="none"/></marker><marker id="arrowActive" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#62a495" stroke="none"/></marker></defs>'+edges.map(e=>{const s=grid.positions.get(e.source),t=grid.positions.get(e.target),sx=s.x+252,sy=s.y+66,tx=t.x-3,ty=t.y+66,dx=Math.max(35,(tx-sx)*.5),isRelated=rel.has(e.source)&&rel.has(e.target);return `<path class="edge ${isRelated?'related':rel.size?'dim':''}" d="M${sx},${sy} C${sx+dx},${sy} ${tx-dx},${ty} ${tx},${ty}" marker-end="url(#${isRelated?'arrowActive':'arrow'})"/>`;}).join('');

    if(grid.cyclic)notice('检测到循环依赖。地图按近似层级展示，请在 GitHub 检查前置关系。');
    if(fit)fitGraph(false);else transform();
  }
  function transform(){
    $('graphWorld').style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;
    $('zoomValue').textContent=Math.round(state.scale*100)+'%';
  }
  function fitGraph(full=true){
    const view=$('graphViewport');if(!view.clientWidth)return;

    state.y=Math.max(20,(view.clientHeight-state.height*state.scale-30)/2);transform();
    if(!full&&fitted<.66)$('canvasHint').textContent='前置事项 → 后续决策 · 向左拖动看后续 · 全图见右侧按钮';
    else $('canvasHint').textContent='连线：前置事项 → 后续决策 · 拖动画布移动';
  }
  function zoom(factor,cx,cy){
    const view=$('graphViewport'),x=cx??view.clientWidth/2,y=cy??view.clientHeight/2;

  function relationship(issue){return `<button class="relationship" data-issue="${issue.key}"><span class="dot ${issue.status}"></span><span><strong>${escape(issue.title)}</strong><small>${STATUS[issue.status]}${issue.external?' · 地图之外':''}</small></span></button>`;}
  function renderDetail(){
    const issue=find(state.selected);if(!issue)return;
    $('inspectorHeading').textContent='决策详情';
    const blockers=(issue.blockedBy||[]).map(find).filter(Boolean);
    const descendants=state.data.edges.filter(e=>e.source===issue.key).map(e=>find(e.target)).filter(Boolean);
    let html=`<h3 class="detail-title">${escape(issue.title)}</h3><div class="detail-badges">${badge(issue)}<span class="node-type">${issue.external?'地图外前置':TYPE[issue.type]}</span></div><div class="detail-meta">${issue.assignees.length?'认领者：'+escape(issue.assignees.join(', ')):'尚未分派'}${issue.updated_at?'<br>议题更新：'+date(issue.updated_at)+'（上海时间）':''}${issue.state_reason==='not_planned'?'<br>关闭原因：不再计划':''}</div>${link(issue.url,'在 GitHub 查看','button primary github-link')}`;
    html+=`<section class="detail-section"><h3>问题</h3><div class="markdown">${markdown(issue.body,true)}</div></section>`;
    if(!issue.external){
      html+=`<section class="detail-section"><h3>前置事项 <span class="muted">${blockers.length}</span></h3>${issue.dependenciesKnown===false?'<div class="empty-note">前置关系未读取成功，状态待核实。</div>':blockers.length?'<div class="relationship-list">'+blockers.map(relationship).join('')+'</div>':'<div class="empty-note">无前置阻塞</div>'}</section>`;
    }
    if(descendants.length)html+=`<section class="detail-section"><h3>后续决策 ${descendants.length}</h3><div class="relationship-list">${descendants.map(relationship).join('')}</div></section>`;
    const comments=issue.comments||[];
    if(!issue.external)html+=`<section class="detail-section"><h3>讨论与决策记录 ${comments.length}</h3>${comments.length?comments.map(c=>`<article class="comment"><div class="comment-meta"><span>${escape(c.author)} · ${date(c.createdAt)}</span>${link(c.url,'原文')}</div><div class="markdown">${markdown(c.body)}</div></article>`).join(''):'<div class="empty-note">该议题暂无评论。</div>'}</section>`;
    if(issue.external)html+='<section class="detail-section"><div class="empty-note">该前置事项不属于当前地图。详情与讨论可在 GitHub 查看。</div></section>';

  }
  function selectIssue(number,open=true){
    state.selected=String(number);if(!find(state.selected))return;

    if(open)setPanelVisible('right',true);

  function clearSelection(){state.selected=null;state.focus=false;$('focusButton').setAttribute('aria-pressed','false');}
  function showOverview(){
    if(!state.data)return;clearSelection();renderList();renderGraph();$('inspectorHeading').textContent='地图说明';
    const names={Destination:'目标',Notes:'地图说明', 'Decisions so far':'已有决策索引','Not yet specified':'尚未明确','Out of scope':'范围之外'};
    $('detailContent').innerHTML=`<h3 class="detail-title">${escape(state.data.map.title)}</h3>${link(state.data.map.url,'在 GitHub 查看地图','button primary github-link')}`+Object.entries(state.data.map.sections).map(([key,value])=>`<section class="detail-section"><h3>${escape(names[key]||key)}</h3><div class="markdown">${markdown(value)}</div></section>`).join('');
    setPanelVisible('right',true);
  }
  function updateFilters(fit=true){renderList();renderGraph(fit);}
  function applyData(data){
    if(state.data&&(state.repo!==data.repo||state.number!==data.map.number)){clearSelection();state.scope='all';state.status='all';state.type='all';state.search='';$('statusFilter').value='all';$('typeFilter').value='all';$('searchInput').value='';}

    $('syncTime').title=`快照时间：${new Date(data.fetchedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}（上海时间），点击刷新获取新状态。`;

  function setBusy(busy){state.busy=busy;$('refreshButton').disabled=busy||offline;$('sourceButton').disabled=busy||offline;$('refreshButton').classList.toggle('busy',busy);$('refreshButton').querySelector('span').textContent=busy?'正在同步…':offline?'离线快照':'刷新地图';}

  async function refresh(repo=state.repo,number=state.number){

  async function openMap(repo,number,notify=true){

  function openSource(){if(offline)return;$('repoInput').value=state.repo;$('mapNumberInput').value=state.number;$('sourceError').textContent='';$('mapChoices').innerHTML='';$('sourceDialog').showModal();}

  document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();showOverview();});
  $('refreshButton').addEventListener('click',()=>refresh());

  function panelVisible(side){

  }
  function setPanelVisible(side,visible){
    const viewport=$('graphViewport'),before=viewport.getBoundingClientRect();

  $('listViewButton').addEventListener('click',()=>mobileMode(true));$('graphViewButton').addEventListener('click',()=>mobileMode(false));
  $('findMapsButton').addEventListener('click',async()=>{const button=$('findMapsButton');button.disabled=true;button.textContent='查找中…';$('sourceError').textContent='';try{const maps=await request('/api/maps?repo='+encodeURIComponent($('repoInput').value.trim()));$('mapChoices').innerHTML=maps.map(m=>`<button type="button" class="map-choice" data-map="${m.number}">${escape(m.title)} <span class="row-meta">${m.state==='closed'?'地图已关闭':'地图开放中'}</span></button>`).join('')||'<div class="empty-note">此仓库没有找到 Wayfinder 地图。</div>';}catch(error){$('sourceError').textContent=error.message;}finally{button.disabled=false;button.textContent='查找地图';}});
  $('mapChoices').addEventListener('click',e=>{const button=e.target.closest('[data-map]');if(button){$('mapNumberInput').value=button.dataset.map;$('mapChoices').querySelectorAll('button').forEach(b=>b.style.borderColor='');button.style.borderColor='var(--accent)';}});
  $('sourceForm').addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;$('sourceError').textContent='';const repo=$('repoInput').value.trim(),number=Number($('mapNumberInput').value);if(!/^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(repo)||!Number.isInteger(number)||number<1){$('sourceError').textContent='请填写有效的 owner/repo 和地图编号。';return;}const button=$('sourceForm').querySelector('[type=submit]');button.disabled=true;button.textContent='正在打开…';const ok=await openMap(repo,number);if(!ok)$('sourceError').textContent=$('notice').textContent;button.disabled=false;button.textContent='打开地图';});
  $('exportButton').addEventListener('click',()=>{if(!state.data)return;if(offline){toast('当前文件已经是可独立打开的 HTML 快照。');return;}const anchor=document.createElement('a');anchor.href=`/api/export?repo=${encodeURIComponent(state.repo)}&number=${state.number}`;anchor.download='wayfinder-map.html';document.body.appendChild(anchor);anchor.click();anchor.remove();toast('已导出当前快照；离线文件无法刷新 GitHub。');});

    if(offline){applyData(window.WAYFINDER_SNAPSHOT);setBusy(false);return;}
    try{const config=await request('/api/config');const query=new URLSearchParams(location.search);state.repo=query.get('repo')||config.repo;state.number=Number(query.get('map')||config.number);await openMap(state.repo,state.number,false);}catch(error){notice(error.message,true);$('destination').textContent='还没有读取到地图，点击刷新重试。';}
  }
  updatePanelControls();
  boot();
})();
</script>

<body>
<header class="app-header">
  <a class="brand" href="#" aria-label="Wayfinder 首页"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="m24 9-2 13-12 9 8-13z"/></svg><span>Wayfinder</span></a>
  <button class="source-button" id="sourceButton" title="切换仓库或地图"><span id="repoLabel">sidpku/DSAaaS</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></button>
  <span class="header-subtitle">决策地图</span>
  <div class="header-actions"><span id="syncTime" class="sync-time">读取本地快照</span><button id="exportButton" class="button subtle" disabled>导出 HTML</button><button id="refreshButton" class="button primary"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6 6 0 1 0 0 6M16 3v4h-4"/></svg><span>刷新地图</span></button></div>
</header>
<div id="notice" class="notice" role="status" hidden></div>
<main class="workspace">
  <aside id="sidebar" class="sidebar" aria-label="地图概览">
    <div class="overview"><h2>项目概览</h2><div id="destination" class="destination">正在读取地图…</div><button id="overviewButton" class="text-button" disabled>查看目标与地图说明<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 5 5 5-5 5"/></svg></button></div>
    <div class="list-tabs" role="tablist" aria-label="决策范围"><button id="frontierTab" role="tab" aria-selected="false" data-scope="frontier">可开始 <span id="frontierCount">0</span></button><button id="allTab" role="tab" aria-selected="true" data-scope="all">全部 <span id="totalCount">0</span></button></div>
    <label class="search-box"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索决策…" aria-label="搜索决策"></label>
    <div id="issueList" class="issue-list" aria-label="决策列表"></div>
    <div class="legend" id="legend"></div>
  </aside>
  <section class="map-area" aria-label="决策依赖地图">
    <div class="map-heading"><h1 id="mapTitle">Wayfinder 决策地图</h1><div id="mapSummary" class="map-summary">GitHub 原生父子关系与阻塞依赖</div></div>
    <div class="map-toolbar"><button id="toggleLeftPanel" class="panel-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="隐藏左侧栏" title="隐藏左侧栏"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M7 3v14"/><path class="panel-arrow" d="m13 7-3 3 3 3"/></svg></button><span class="view-label"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2" width="6" height="4" rx="1"/><rect x="1" y="13" width="6" height="4" rx="1"/><rect x="13" y="13" width="6" height="4" rx="1"/><path d="M10 6v4M4 13v-3h12v3"/></svg>依赖地图</span><label class="select-wrap"><select id="statusFilter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="frontier">可开始</option><option value="blocked">被阻塞</option><option value="claimed">已认领</option><option value="closed">已关闭</option><option value="unknown">待核实</option></select></label><label class="select-wrap"><select id="typeFilter" aria-label="按决策类型筛选"><option value="all">全部类型</option><option value="grilling">讨论</option><option value="research">调研</option><option value="prototype">原型</option><option value="task">准备事项</option></select></label><button id="focusButton" class="button subtle compact" aria-pressed="false">聚焦关联</button><button id="toggleRightPanel" class="panel-toggle" aria-controls="inspector" aria-expanded="true" aria-label="隐藏右侧栏" title="隐藏右侧栏"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M13 3v14"/><path class="panel-arrow" d="m7 7 3 3-3 3"/></svg></button></div>
    <div class="mobile-tabs" role="tablist" aria-label="地图视图"><button class="active" id="graphViewButton">关系图</button><button id="listViewButton">决策列表</button></div>
    <div id="graphViewport" class="graph-viewport" tabindex="0" aria-label="依赖画布，可拖动平移，滚轮缩放"><div id="graphWorld" class="graph-world"><svg id="graphEdges" class="graph-edges" aria-hidden="true"></svg><div id="graphNodes"></div></div><div id="graphEmpty" class="graph-empty" hidden></div></div>
    <div class="canvas-footer"><span id="canvasHint">连线：前置事项 → 后续决策 · 拖动画布移动</span><div class="zoom-controls"><button id="fitButton" title="适应画布" aria-label="适应画布"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button><button id="zoomOutButton" aria-label="缩小"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button><button id="zoomValue" title="重置为 100%">100%</button><button id="zoomInButton" aria-label="放大"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg></button></div></div>
  </section>
  <aside id="inspector" class="inspector" aria-label="决策详情"><div class="inspector-header"><h2 id="inspectorHeading">决策详情</h2><button id="closeDetail" class="icon-button" aria-label="关闭详情" title="隐藏右侧栏"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div><div id="detailContent" class="detail-content"><div class="detail-placeholder">选择一个决策，查看问题、前置事项与讨论记录。</div></div><footer>来源：GitHub 原生关系<br><span>已认领表示议题已分派，不代表正在执行。</span></footer></aside>
</main>
<dialog id="sourceDialog" class="source-dialog"><form id="sourceForm"><div class="dialog-heading"><h2>打开 Wayfinder 地图</h2><button type="button" id="closeSource" class="icon-button" aria-label="关闭"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div><label>GitHub 仓库<input id="repoInput" required value="sidpku/DSAaaS" placeholder="owner/repo" autocomplete="off"></label><div class="map-picker"><label>地图议题编号<input id="mapNumberInput" required type="number" min="1" value="1"></label><button type="button" id="findMapsButton" class="button subtle">查找地图</button></div><div id="mapChoices" class="map-choices"></div><p id="sourceError" class="form-error" role="alert"></p><p class="form-hint">使用本机 gh 的登录账号读取数据。请选有 wayfinder:map 标签的地图议题。</p><button type="submit" class="button primary open-map-button">打开地图</button></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
